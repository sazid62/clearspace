[package]
name = "clearspace"
version = "2.0.0"
description = "Clearspace desktop app"
authors = ["sazid62"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "clearspace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9.0"
dirs = "7.0.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-clipboard-manager = "2.5.0"
trash = "5.4.0"
sysinfo = { version = "0.40.4", default-features = false, features = ["system", "disk", "network"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[target."cfg(target_os = \"macos\")".dependencies]
plist = "1.10.4"
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGImage"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSDictionary", "NSData", "NSURL", "NSArray", "NSValue", "NSError", "NSAppleScript", "NSAppleEventDescriptor", "NSGeometry", "NSObject"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "libc", "block2", "objc2-core-foundation", "objc2-core-graphics", "NSEvent", "NSResponder", "NSWindow", "NSView", "NSWorkspace", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext", "NSRunningApplication"] }

[target."cfg(windows)".dependencies]
winreg = "0.56.0"
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_Power"] }
