# Builds the cross-platform app (desktop/) on macOS, Windows and Ubuntu, and on each one opens the
# real app, runs its scripted self-test (shell, groups, swipe, quit, reopen, restore) and fails the
# build if any check fails. Installers are attached to the run as artifacts.
name: Desktop app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            build-args: --target universal-apple-darwin
            binary: src-tauri/target/universal-apple-darwin/release/bundle/macos/Clearspace.app/Contents/MacOS/clearspace
          - name: Windows
            os: windows-latest
            rust-targets: ""
            build-args: ""
            binary: src-tauri/target/release/clearspace.exe
          - name: Ubuntu
            # The oldest supported Ubuntu, so the .deb and AppImage run on 22.04 and newer.
            os: ubuntu-22.04
            rust-targets: ""
            build-args: ""
            binary: src-tauri/target/release/clearspace
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - run: npm ci
      - run: npx tsc --noEmit

      - name: Rust tests
        working-directory: desktop/src-tauri
        run: cargo test

      - name: Build
        run: npx tauri build ${{ matrix.build-args }}

      - name: Self-test (opens the app, runs a scripted session, quits, reopens)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a node scripts/selftest.mjs "${{ matrix.binary }}" "$RUNNER_TEMP/selftest"
          else
            node scripts/selftest.mjs "${{ matrix.binary }}" "$RUNNER_TEMP/selftest"
          fi

      - name: Self-test snapshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-${{ matrix.name }}
          path: ${{ runner.temp }}/selftest
          if-no-files-found: ignore

      - name: Installers
        uses: actions/upload-artifact@v4
        with:
          name: Clearspace-${{ matrix.name }}
          path: |
            desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/**/release/bundle/msi/*.msi
            desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            desktop/src-tauri/target/**/release/bundle/deb/*.deb
            desktop/src-tauri/target/**/release/bundle/rpm/*.rpm
            desktop/src-tauri/target/**/release/bundle/appimage/*.AppImage
